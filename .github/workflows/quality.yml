name: Calidad y seguridad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validar sintaxis
        run: node --check server.js && find routes services middleware scripts -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Probar checkout
        run: node scripts/test-checkout-validation.js
      - name: Probar webhook Cubo
        run: node scripts/test-webhook-cubo.js

  mobile:
    name: App móvil y web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bocara-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bocara-mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build:web
